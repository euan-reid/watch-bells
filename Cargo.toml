[package]
name = "watch-bells"
version = "0.7.0"
edition = "2024"
homepage = "https://www.watchbells.com/"
repository = "https://github.com/euan-reid/watch-bells"
license = "MIT"

[workspace]
resolver = "3"
members = ["xtask"]
default-members = ["."]

[dependencies]
chrono = "0.4.45"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = { version = "0.4.34", features = ["std"] }
rodio = { version = "0.22.2", features = ["playback"] }
rust-embed = "8.13.0"
# Use the D-Bus tray backend to avoid the obsolete GTK 3/GLib bindings.
tray-icon = {
  version = "0.26.1",
  default-features = false,
  features = ["ksni"]
}
# This application has no windows, so client-side window decorations are unused.
winit = {
  version = "0.30",
  default-features = false,
  features = ["rwh_06", "wayland", "wayland-dlopen", "x11"]
}

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"

# Linux build requirements (system packages, not Rust crates):
#   apt: pkg-config libxcb1-dev libxkbcommon-dev libasound2-dev
#   dnf: pkg-config libxcb-devel libxkbcommon-devel alsa-lib-devel
# Windows: all platform APIs are covered by winit/tray-icon/rodio directly.

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1

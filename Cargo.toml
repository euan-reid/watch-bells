[package]
name = "watch-bells"
version = "0.5.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.29"
rodio = { version = "0.22.2", features = ["playback"] }
rust-embed = "8.11.0"
simple_logger = "5.2.0"
tray-icon = "0.24.0"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3.2"

# Linux build requirements (system packages, not Rust crates):
#   apt: pkg-config libgtk-3-dev libxcb1-dev libxkbcommon-dev libasound2-dev libxdo-dev
#   dnf: pkg-config gtk3-devel libxcb-devel libxkbcommon-devel alsa-lib-devel
# Windows: all platform APIs are covered by winit/tray-icon/rodio directly.

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1

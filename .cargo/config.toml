[term]
color = "always"

# Cross-compilation linker for Windows builds on Linux (requires mingw-w64).
# With this in place, `cargo build --target x86_64-pc-windows-gnu` works both
# locally (if mingw-w64 is installed) and in CI without extra cargo flags.
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

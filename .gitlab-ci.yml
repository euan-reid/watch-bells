workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - src/**/*
        - assets/**/*
        - .cargo/**/*
        - Cargo.toml
        - Cargo.lock
        - README.md
        - .gitlab-ci.yml
      when: always
    - when: never

stages:
  - install
  - test
  - build
  - package

variables:
  RUST_TOOLCHAIN: stable
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo

.cargo_cache: &cargo_cache
  key:
    files:
      - Cargo.lock
    prefix: cargo-${RUST_TOOLCHAIN}-${CI_RUNNER_EXECUTABLE_ARCH}
  paths:
    - .cargo/registry/index/
    - .cargo/registry/cache/
    - .cargo/git/db/
    - target/
  policy: pull

cache: *cargo_cache

.linux_rust_job:
  image: rust:latest
  tags:
    - saas-linux-small-amd64
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends pkg-config libgtk-3-dev libxcb1-dev libxkbcommon-dev libasound2-dev libxdo-dev mingw-w64
    - |
      if ! rustup toolchain list | grep -q "^${RUST_TOOLCHAIN}"; then
        rustup toolchain install ${RUST_TOOLCHAIN} --profile minimal
      fi
    - rustup default ${RUST_TOOLCHAIN}
    - rustc --version
    - cargo --version

install:linux:
  stage: install
  extends: .linux_rust_job
  cache:
    <<: *cargo_cache
    policy: pull-push
  script:
    - echo "Linux environment ready"

test:linux:
  stage: test
  extends: .linux_rust_job
  needs: ["install:linux"]
  script:
    - cargo test --verbose

lint:linux:
  stage: test
  extends: .linux_rust_job
  needs: ["install:linux"]
  script:
    - rustup component add clippy
    - cargo clippy --all-targets -- -D warnings

build:linux:
  stage: build
  extends: .linux_rust_job
  needs: ["install:linux"]
  script:
    - cargo build --verbose --release
    - mkdir -p dist/linux
    - cp target/release/watch-bells dist/linux/watch-bells-linux-x86_64
  artifacts:
    name: watch-bells-linux-${CI_COMMIT_SHORT_SHA}
    expire_in: 2 days
    paths:
      - dist/linux/watch-bells-linux-x86_64

build:windows:
  stage: build
  extends: .linux_rust_job
  needs: ["install:linux"]
  script:
    - rustup target add x86_64-pc-windows-gnu
    - cargo build --verbose --release --target x86_64-pc-windows-gnu
    - mkdir -p dist/windows
    - cp target/x86_64-pc-windows-gnu/release/watch-bells.exe dist/windows/watch-bells-windows-x86_64.exe
  artifacts:
    name: watch-bells-windows-${CI_COMMIT_SHORT_SHA}
    expire_in: 2 days
    paths:
      - dist/windows/watch-bells-windows-x86_64.exe

install:macos:
  stage: install
  allow_failure: true
  tags:
    - saas-macos-medium-m1
  image: macos-15-xcode-16
  before_script:
    - |
      if ! command -v rustup >/dev/null 2>&1; then
        curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
      fi
    - source "$HOME/.cargo/env"
    - |
      if ! rustup toolchain list | grep -q "^${RUST_TOOLCHAIN}"; then
        rustup toolchain install ${RUST_TOOLCHAIN} --profile minimal
      fi
    - rustup default ${RUST_TOOLCHAIN}
    - rustc --version
    - cargo --version
  cache:
    <<: *cargo_cache
    policy: pull-push
  script:
    - echo "macOS environment ready"

build:macos:
  stage: build
  allow_failure: true
  tags:
    - saas-macos-medium-m1
  image: macos-15-xcode-16
  needs: ["install:macos"]
  before_script:
    - |
      if ! command -v rustup >/dev/null 2>&1; then
        curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
      fi
    - source "$HOME/.cargo/env"
    - |
      if ! rustup toolchain list | grep -q "^${RUST_TOOLCHAIN}"; then
        rustup toolchain install ${RUST_TOOLCHAIN} --profile minimal
      fi
    - rustup default ${RUST_TOOLCHAIN}
    - rustc --version
    - cargo --version
  script:
    - source "$HOME/.cargo/env"
    - cargo build --verbose --release
    - cargo run --verbose --release --bin xtask -- package-macos --binary target/release/watch-bells --out dist/macos --version "${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
  artifacts:
    name: watch-bells-macos-${CI_COMMIT_SHORT_SHA}
    expire_in: 2 days
    paths:
      - dist/macos/watch-bells-macos-aarch64.zip

package:website-downloads:
  stage: package
  image: alpine:latest
  tags:
    - saas-linux-small-amd64
  needs:
    - job: build:linux
      artifacts: true
    - job: build:windows
      artifacts: true
    - job: build:macos
      artifacts: true
      optional: true
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
  script:
    - apk add --no-cache git
    - git --no-pager config user.name "watch-bells-ci"
    - git --no-pager config user.email "watch-bells-ci@users.noreply.gitlab.com"
    - git --no-pager remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git --no-pager fetch origin "${CI_DEFAULT_BRANCH}"
    - git --no-pager checkout -B "${CI_DEFAULT_BRANCH}" "origin/${CI_DEFAULT_BRANCH}"
    - cargo run --verbose --release --bin xtask -- publish-downloads --source dist --website website/public/downloads --version "${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
    - git --no-pager add -A website/public/downloads
    - |
      if git --no-pager diff --cached --quiet; then
        echo "No download updates to commit."
        exit 0
      fi
    - 'git --no-pager commit -m "chore(downloads): publish ${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}} binaries"'
    - git --no-pager push origin "HEAD:${CI_DEFAULT_BRANCH}"
  artifacts:
    name: watch-bells-site-downloads-${CI_COMMIT_SHORT_SHA}
    expire_in: 14 days
    paths:
      - website/public/downloads/

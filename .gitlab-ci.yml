workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - src/**/*
        - assets/**/*
        - .cargo/**/*
        - Cargo.toml
        - Cargo.lock
        - README.md
        - .gitlab-ci.yml
      when: always
    - when: never

stages:
  - install
  - test
  - build
  - package

variables:
  RUST_TOOLCHAIN: stable

cache:
  key: ${CI_JOB_NAME}
  paths:
    - .cargo/registry/
    - .cargo/git/
    - target/

.linux_rust_job:
  image: rust:latest
  tags:
    - saas-linux-small-amd64
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends pkg-config libgtk-3-dev libxcb1-dev libxkbcommon-dev libasound2-dev libxdo-dev mingw-w64
    - rustup toolchain install ${RUST_TOOLCHAIN} --profile minimal
    - rustup default ${RUST_TOOLCHAIN}
    - rustc --version
    - cargo --version

install:linux:
  stage: install
  extends: .linux_rust_job
  script:
    - echo "Linux environment ready"

test:linux:
  stage: test
  extends: .linux_rust_job
  needs: [install:linux]
  script:
    - cargo test --verbose

lint:linux:
  stage: test
  extends: .linux_rust_job
  needs: [install:linux]
  script:
    - rustup component add clippy
    - cargo clippy --all-targets -- -D warnings

build:linux:
  stage: build
  extends: .linux_rust_job
  needs: [install:linux]
  script:
    - cargo build --verbose --release
    - mkdir -p dist/linux
    - cp target/release/watch-bells dist/linux/watch-bells-linux-x86_64
  artifacts:
    name: watch-bells-linux-${CI_COMMIT_SHORT_SHA}
    paths:
      - dist/linux/watch-bells-linux-x86_64

build:windows:
  stage: build
  extends: .linux_rust_job
  needs: [install:linux]
  script:
    - rustup target add x86_64-pc-windows-gnu
    - cargo build --verbose --release --target x86_64-pc-windows-gnu
    - mkdir -p dist/windows
    - cp target/x86_64-pc-windows-gnu/release/watch-bells.exe dist/windows/watch-bells-windows-x86_64.exe
  artifacts:
    name: watch-bells-windows-${CI_COMMIT_SHORT_SHA}
    paths:
      - dist/windows/watch-bells-windows-x86_64.exe

install:macos:
  stage: install
  allow_failure: true
  tags:
    - saas-macos-medium-m1
  image: macos-15-xcode-16
  before_script:
    - |
      if ! command -v rustup >/dev/null 2>&1; then
        curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
      fi
    - source "$HOME/.cargo/env"
    - rustup toolchain install ${RUST_TOOLCHAIN} --profile minimal
    - rustup default ${RUST_TOOLCHAIN}
    - rustc --version
    - cargo --version
  script:
    - echo "macOS environment ready"

build:macos:
  stage: build
  allow_failure: true
  tags:
    - saas-macos-medium-m1
  image: macos-15-xcode-16
  needs: [install:macos]
  before_script:
    - |
      if ! command -v rustup >/dev/null 2>&1; then
        curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
      fi
    - source "$HOME/.cargo/env"
    - rustup toolchain install ${RUST_TOOLCHAIN} --profile minimal
    - rustup default ${RUST_TOOLCHAIN}
    - rustc --version
    - cargo --version
  script:
    - source "$HOME/.cargo/env"
    - cargo build --verbose --release
    - mkdir -p dist/macos
    - cp target/release/watch-bells dist/macos/watch-bells-macos-aarch64
  artifacts:
    name: watch-bells-macos-${CI_COMMIT_SHORT_SHA}
    paths:
      - dist/macos/watch-bells-macos-aarch64

package:website-downloads:
  stage: package
  image: alpine:latest
  tags:
    - saas-linux-small-amd64
  needs:
    - job: build:linux
      artifacts: true
    - job: build:windows
      artifacts: true
    - job: build:macos
      artifacts: true
      optional: true
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
  script:
    - VERSION="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
    - VERSION_DIR="website/public/downloads/${VERSION}"
    - LATEST_DIR="website/public/downloads/latest"
    - mkdir -p "${VERSION_DIR}" "${LATEST_DIR}"
    - cp dist/linux/watch-bells-linux-x86_64 "${VERSION_DIR}/"
    - cp dist/linux/watch-bells-linux-x86_64 "${LATEST_DIR}/"
    - cp dist/windows/watch-bells-windows-x86_64.exe "${VERSION_DIR}/"
    - cp dist/windows/watch-bells-windows-x86_64.exe "${LATEST_DIR}/"
    - |
      if [ -f dist/macos/watch-bells-macos-aarch64 ]; then
        cp dist/macos/watch-bells-macos-aarch64 "${VERSION_DIR}/"
        cp dist/macos/watch-bells-macos-aarch64 "${LATEST_DIR}/"
      fi
    - printf "%s\n" "${VERSION}" > "${LATEST_DIR}/VERSION"
  artifacts:
    name: watch-bells-site-downloads-${CI_COMMIT_SHORT_SHA}
    paths:
      - website/public/downloads/

name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: watch-bells-release-publication
  cancel-in-progress: false

env:
  LINUX_AARCH64_ARTIFACT: watch-bells-linux-aarch64
  LINUX_X86_64_ARTIFACT: watch-bells-linux-x86_64
  MACOS_ARTIFACT: watch-bells-macos-universal.zip
  RUSTUP_TOOLCHAIN: stable
  WINDOWS_ARTIFACT: watch-bells-windows-x86_64.exe

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Match tag to Cargo package version
        id: version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use the established stable-semver form, for example 0.7.0." >&2
            exit 1
          fi

          package_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "watch-bells") | .version'
          )"
          if [[ -z "$package_version" || "$package_version" != "$TAG_NAME" ]]; then
            echo "Tag $TAG_NAME does not match Cargo package version $package_version." >&2
            exit 1
          fi

          echo "version=$package_version" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux (${{ matrix.architecture }})
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86-64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            output_name: watch-bells-linux-x86_64
          - architecture: ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            output_name: watch-bells-linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libgtk-3-dev \
            libxcb1-dev \
            libxdo-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Build native release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$TARGET"

      - name: Stage final release binary
        env:
          OUTPUT_NAME: ${{ matrix.output_name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          install -m 755 "target/$TARGET/release/watch-bells" "dist/$OUTPUT_NAME"

      - name: Upload final Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-linux-${{ matrix.target }}
          path: dist/${{ matrix.output_name }}
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows (x86-64 MSVC)
    needs: validate-version
    runs-on: windows-2025
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Build native release executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Stage final release executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/watch-bells.exe dist/watch-bells-windows-x86_64.exe

      - name: Upload final Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-windows-x86_64
          path: dist/watch-bells-windows-x86_64.exe
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build macOS (${{ matrix.architecture }})
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: Apple silicon
            artifact_architecture: arm64
            runner: macos-15
            target: aarch64-apple-darwin
            deployment_target: '11.0'
          - architecture: Intel
            artifact_architecture: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            deployment_target: '10.13'
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - name: Build native release executable
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$TARGET"

      - name: Verify native architecture and deployment target
        env:
          EXPECTED_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
          EXPECTED_ARCHITECTURE: ${{ matrix.artifact_architecture }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          executable="target/$TARGET/release/watch-bells"
          architectures="$(lipo -archs "$executable")"
          build_information="$(vtool -show-build "$executable")"
          lipo -info "$executable"
          echo "$build_information"
          if [[ "$architectures" != "$EXPECTED_ARCHITECTURE" ]]; then
            echo "Expected only $EXPECTED_ARCHITECTURE, found $architectures." >&2
            exit 1
          fi
          if ! grep -Eq \
            "^[[:space:]]+(minos|version) $EXPECTED_DEPLOYMENT_TARGET$" \
            <<< "$build_information"; then
            echo "Expected minimum macOS $EXPECTED_DEPLOYMENT_TARGET." >&2
            exit 1
          fi

      - name: Upload intermediate macOS executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intermediate-macos-${{ matrix.artifact_architecture }}
          path: target/${{ matrix.target }}/release/watch-bells
          if-no-files-found: error
          retention-days: 2

  package-macos:
    name: Package universal macOS application
    needs:
      - validate-version
      - build-macos
    runs-on: macos-15
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Apple-silicon executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: intermediate-macos-arm64
          path: dist/macos-arm64

      - name: Download Intel executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: intermediate-macos-x86_64
          path: dist/macos-x86_64

      - name: Build and verify universal application bundle
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          cargo run --locked --release --bin xtask -- package-macos \
            --arm64-binary dist/macos-arm64/watch-bells \
            --x86_64-binary dist/macos-x86_64/watch-bells \
            --out dist/macos-universal \
            --version "$VERSION"

      - name: Independently inspect packaged executable
        run: |
          set -euo pipefail
          verification_dir="$(mktemp -d)"
          unzip -q dist/macos-universal/watch-bells-macos-universal.zip \
            -d "$verification_dir"
          executable="$verification_dir/Watch Bells.app/Contents/MacOS/watch-bells"
          architectures="$(lipo -archs "$executable")"
          lipo -info "$executable"
          plutil -lint "$verification_dir/Watch Bells.app/Contents/Info.plist"
          iconutil -c iconset \
            "$verification_dir/Watch Bells.app/Contents/Resources/WatchBells.icns" \
            -o "$verification_dir/decoded.iconset"

          for required_architecture in arm64 x86_64; do
            if [[ " $architectures " != *" $required_architecture "* ]]; then
              echo "Missing $required_architecture slice: $architectures" >&2
              exit 1
            fi
          done
          read -r -a architecture_list <<< "$architectures"
          if [[ "${#architecture_list[@]}" -ne 2 ]]; then
            echo "Unexpected architecture set: $architectures" >&2
            exit 1
          fi

      - name: Upload final universal macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-macos-universal
          path: dist/macos-universal/watch-bells-macos-universal.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish website downloads and GitHub Release
    needs:
      - validate-version
      - build-linux
      - build-windows
      - package-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Linux x86-64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: final-linux-x86_64-unknown-linux-gnu
          path: dist/release

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: final-linux-aarch64-unknown-linux-gnu
          path: dist/release

      - name: Download Windows x86-64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: final-windows-x86_64
          path: dist/release

      - name: Download universal macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: final-macos-universal
          path: dist/release

      - name: Compile release task and validate final artifact set
        run: |
          rustc --edition=2024 src/bin/xtask.rs \
            --output "$RUNNER_TEMP/watch-bells-xtask"
          "$RUNNER_TEMP/watch-bells-xtask" validate-release \
            --source dist/release

      - name: Inspect existing GitHub Release
        id: release-state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1; then
            echo "state=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          is_draft="$(
            gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq '.isDraft'
          )"
          if [[ "$is_draft" == "true" ]]; then
            echo "state=draft" >> "$GITHUB_OUTPUT"
          else
            echo "state=published" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or reuse draft GitHub Release
        if: steps.release-state.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATE: ${{ steps.release-state.outputs.state }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          if [[ "$RELEASE_STATE" == "missing" ]]; then
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --generate-notes \
              --title "Watch Bells $VERSION" \
              --verify-tag
          else
            echo "Reusing existing draft release for $TAG_NAME."
          fi

      - name: Upload all assets to draft GitHub Release
        if: steps.release-state.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG_NAME" \
            "dist/release/$MACOS_ARTIFACT" \
            "dist/release/$WINDOWS_ARTIFACT" \
            "dist/release/$LINUX_X86_64_ARTIFACT" \
            "dist/release/$LINUX_AARCH64_ARTIFACT" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Validate GitHub Release asset set
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected_assets="$(
            printf '%s\n' \
              "$MACOS_ARTIFACT" \
              "$WINDOWS_ARTIFACT" \
              "$LINUX_X86_64_ARTIFACT" \
              "$LINUX_AARCH64_ARTIFACT" |
              sort
          )"
          actual_assets="$(
            gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' |
              sort
          )"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "GitHub Release assets do not match the required set." >&2
            diff <(printf '%s\n' "$expected_assets") \
              <(printf '%s\n' "$actual_assets") || true
            exit 1
          fi

      - name: Check out current main branch
        run: |
          git fetch origin main
          git checkout -B main FETCH_HEAD

      - name: Verify website copy for an already-published release
        if: steps.release-state.outputs.state == 'published'
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          "$RUNNER_TEMP/watch-bells-xtask" validate-release \
            --source "website/public/downloads/$VERSION"
          echo "Release $VERSION is already complete; no publication changes are needed."

      - name: Populate versioned and latest website downloads
        if: steps.release-state.outputs.state != 'published'
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          "$RUNNER_TEMP/watch-bells-xtask" publish-downloads \
            --source dist/release \
            --website website/public/downloads \
            --version "$VERSION"

      - name: Commit and push generated website downloads
        if: steps.release-state.outputs.state != 'published'
        env:
          VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- \
            "website/public/downloads/$VERSION" \
            website/public/downloads/latest

          while IFS= read -r staged_path; do
            case "$staged_path" in
              "website/public/downloads/$VERSION/"* | \
                website/public/downloads/latest/*)
                ;;
              *)
                echo "Refusing to commit unexpected path: $staged_path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)

          if git diff --cached --quiet; then
            echo "Website downloads already contain release $VERSION."
          else
            git commit -m "chore(downloads): publish $VERSION binaries"
            # GITHUB_TOKEN pushes do not recursively start another Actions run.
            git push origin HEAD:main
          fi

      - name: Publish GitHub Release
        if: steps.release-state.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release edit "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
